worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  log_format  main  '$remote_addr $status $request_time "$request" "$http_user_agent"';
  access_log  /dev/stdout main;
  error_log   /dev/stderr warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/geo+json application/javascript text/css
             text/plain text/html image/svg+xml;

  # Redis owns response caching (PLAN §18); nginx only relays ETags.
  proxy_cache off;

  # Docker's embedded DNS. Resolving through a variable makes nginx re-resolve at request time:
  # with a static upstream it caches the container IP at startup and 502s after `web` is
  # recreated (image rebuild, restart, rescheduling).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    client_max_body_size 2m;

    # Vendored libraries are version-pinned in the filename's directory and never change in
    # place, so they can be cached hard.
    location /static/vendor/ {
      alias /srv/static/vendor/;
      add_header Cache-Control "public, max-age=2592000, immutable";
      access_log off;
    }

    # The app's own JS/CSS *do* change on every deploy and are referenced by fixed names. Caching
    # them for days means a deployed fix never reaches anyone still holding the old bundle, so
    # these revalidate against their ETag instead — a conditional request, not a re-download.
    location /static/ {
      alias /srv/static/;
      add_header Cache-Control "no-cache";
      etag on;
      access_log off;
    }

    location = / {
      root /srv/static;
      try_files /index.html =404;
      add_header Cache-Control "no-cache";
    }

    location /api/ {
      set $web_upstream web:5001;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /admin {
      set $web_upstream web:5001;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location = /healthz {
      set $web_upstream web:5001;
      proxy_pass http://$web_upstream;
      proxy_set_header Host $host;
      access_log off;
    }
  }
}
