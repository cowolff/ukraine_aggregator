# Reference deployment: 2 vCPU / 4 GB node. RAM budget ~1.3 GB (PLAN §6).
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      # Host port 80 is held by the machine-wide reverse proxy; override with NGINX_HTTP_PORT.
      - "${NGINX_HTTP_PORT:-3030}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/srv/static:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and nginx listens on IPv4 only,
      # which made the healthcheck fail with "connection refused" while the proxy was fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "5001"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukraine:ukraine@postgis:5432/ukraine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Polling, geocoding, rules and the frontline builder. Kept off the llm queue so a slow proxy
  # call can never stall the map.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "--concurrency=4",
              "-Q", "control,default", "--hostname=default@%h", "--loglevel=info"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukraine:ukraine@postgis:5432/ukraine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Extraction and translation. Concurrency 4 is the measured saturation point of the reference
  # LiteLLM proxy: beyond it latency doubles and 5xx errors appear with no throughput gain.
  llmworker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "celery_worker.celery_app", "worker",
              "--concurrency=${LLM_CONCURRENCY:-4}", "-Q", "llm", "--hostname=llm@%h",
              "--loglevel=info"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukraine:ukraine@postgis:5432/ukraine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["celery", "-A", "celery_worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ukraine:ukraine@postgis:5432/ukraine
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru",
              "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=60"
    environment:
      POSTGRES_USER: ukraine
      POSTGRES_PASSWORD: ukraine
      POSTGRES_DB: ukraine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukraine -d ukraine"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    image: postgis/postgis:16-3.4-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          PGPASSWORD=ukraine pg_dump -h postgis -U ukraine -Fc ukraine \
            > /backups/ukraine-$$(date +%Y%m%d).dump && \
          find /backups -name 'ukraine-*.dump' -mtime +14 -delete
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
