name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ukraine
          POSTGRES_PASSWORD: ukraine
          POSTGRES_DB: ukraine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ukraine" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      # The LLM is always mocked in tests; these only satisfy config validation.
      TEST_DATABASE_URL: postgresql+psycopg://ukraine:ukraine@localhost:5432/ukraine_test
      TEST_REDIS_URL: redis://localhost:6379/1
      LITELLM_API_BASE: https://proxy.invalid/v1
      LITELLM_MODEL: test-model
      LITELLM_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
